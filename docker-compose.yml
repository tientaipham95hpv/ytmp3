name: offlinetube

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      OFFLINETUBE_DATA_DIR: /data
      CORS_ORIGINS: "*"
      PYTHONUNBUFFERED: "1"
    volumes:
      - offlinetube-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  offlinetube-data:
