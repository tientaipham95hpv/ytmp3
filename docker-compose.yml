name: offlinetube

services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-deno
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      OFFLINETUBE_DATA_DIR: /data
      POT_PROVIDER_URL: http://pot-provider:4416
      YOUTUBE_COOKIES_FILE: /run/secrets/youtube-cookies.txt
      API_ACCESS_TOKEN_FILE: /run/secrets/api-access-token.txt
      CORS_ORIGINS: "*"
      PYTHONUNBUFFERED: "1"
    depends_on:
      - pot-provider
    volumes:
      - offlinetube-data:/data
      - ./secrets:/run/secrets
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  offlinetube-data:
