name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build OfflineTube (unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          IPA_NAME="OfflineTube-${VERSION}-unsigned.ipa"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Test local search with 50k fake records
        run: |
          set -euo pipefail
          xcrun swiftc \
            OfflineTube/OfflineTube/Services/LocalSearchEngine.swift \
            OfflineTube/SearchBenchmark/main.swift \
            -o "$RUNNER_TEMP/search-benchmark"
          "$RUNNER_TEMP/search-benchmark"

      - name: Build Release for iphoneos
        run: |
          set -euo pipefail
          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"
          set +e
          xcodebuild \
            -project OfflineTube/OfflineTube.xcodeproj \
            -scheme OfflineTube \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$BUILD_LOG"
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -ne 0 ]; then
            grep -E '(^|: )(error:|fatal error:)' "$BUILD_LOG" | tail -n 20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$RESULT"
          fi

      - name: Package unsigned IPA
        env:
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/OfflineTube.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/OfflineTube.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry -y "$GITHUB_WORKSPACE/$IPA_NAME" Payload
          test -s "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: Validate IPA structure
        env:
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/$IPA_NAME"
          VERIFY="$RUNNER_TEMP/verify-ipa"
          /usr/bin/unzip -t "$IPA"
          mkdir -p "$VERIFY"
          /usr/bin/unzip -q "$IPA" -d "$VERIFY"
          APP="$VERIFY/Payload/OfflineTube.app"
          PLIST="$APP/Info.plist"
          test -d "$APP"
          test -f "$PLIST"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          test -n "$EXECUTABLE"
          test -n "$BUNDLE_ID"
          test -x "$APP/$EXECUTABLE"
          /usr/bin/file "$APP/$EXECUTABLE" | grep -q 'Mach-O'
          if /usr/bin/unzip -Z1 "$IPA" | grep -qv '^Payload/'; then
            echo "IPA contains entries outside Payload/" >&2
            exit 1
          fi
          echo "Validated $BUNDLE_ID ($EXECUTABLE)"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTube-${{ steps.package.outputs.version }}-unsigned-IPA
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish direct IPA download
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$GITHUB_WORKSPACE/$IPA_NAME#$IPA_NAME" \
            --title "OfflineTube $GITHUB_REF_NAME" \
            --generate-notes
