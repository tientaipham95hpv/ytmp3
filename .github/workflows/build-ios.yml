name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build OfflineTube (unsigned)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release for iphoneos
        run: |
          set -euo pipefail
          xcodebuild \
            -project OfflineTube/OfflineTube.xcodeproj \
            -scheme OfflineTube \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/OfflineTube.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/OfflineTube.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/OfflineTube-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/OfflineTube-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OfflineTube-unsigned-${{ github.ref_name }}
          path: OfflineTube-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
